# dsh-vocab-review bundle patch
#
# Inserts the Host plugin row. The Client half is discovered from
# package.json `dsh.client` and the `./client` export.
#
# Daily limits default to 0 = unlimited for the total/minutes caps; the per-type
# defaults cap runaway review days. All of them (and reminderMaxPerDay) are also
# editable at runtime from the sidebar panel and stored in settings.json.
#
# verifyAnswers: the plugin re-checks every model ✅ against the meaning it
# stored for that word and schedules a mismatch as wrong. It only does so when
# the user's short typed answer is actually visible (DSH system-reminder context
# is stripped first). Set it to false to trust the model's grading alone.
#
# ladderMinutes: the interval a ✅ earns is the rung the word is on NOW; the word
# only steps up afterwards (30m -> 3h -> 12h -> 2d -> 7d -> 30d). A ❌ is not a
# rung: it drops the word to rung 0 and re-asks it after retryDelayMinutes.
# wrongInject only orders words that are already due — nothing is asked before
# its dueAt.
#
# articleMaxWords: a plain article image (no underlines) goes through
# vocab_import_article; the model picks the exam high-frequency words, basic
# everyday words are filtered out, and at most this many are added per import.
#
# includeHighFreq: a worksheet image with underlines may also contain exam
# high-frequency words that are not underlined. When true (default) the model
# passes them as `extra` and they are added to the ledger too (same filtering +
# the articleMaxWords cap). Set false to import underlined words only.
#
# examLevel: which exam's high-frequency vocabulary an article import targets —
# gaokao | cet4 | cet6 | kaoyan | any (default CET-4). The user can override it
# per import by naming the exam (高考/四级/六级/考研).
#
# ladderMinutes (v2.3.0): days-based memory curve — 10m, 1d, 3d, 7d, 14d, 30d.
# A ✅ earns the interval of the rung the word is on and then steps up; a clean
# first try skips the 10-minute consolidation rung. A ❌ is not a rung: it drops
# the word to rung 0 and re-asks it after retryDelayMinutes.
#
# newWordsPerBatch: slots reserved for never-asked words in every batch, so a
# backlog of due reviews cannot keep the same handful of words in rotation.
# maxRepsPerDay: hard ceiling per word per day; after it the word waits for the
# next morning instead of being drilled again.
#
# The optional QQ channel has two transports:
# 1. built-in (default when configured in the panel): this plugin connects to the
#    QQ 开放平台 itself with an AppID / AppSecret, no third-party plugin. The
#    credentials are saved in settings.json via the sidebar panel, never here.
# 2. bridge: if dsh-qq-bot is installed/bound instead, its state file and
#    send_qq_message tool are used.
# One QQ bot app can only hold one gateway connection: do not run the built-in
# client and dsh-qq-bot on the same AppID.
#
# qqApiBase overrides the QQ 开放平台 API host (default https://api.sgroup.qq.com).
- insert:
    - id: vocab-review
      name: dsh-vocab-review
      config:
        queueSize: 5
        autoContinue: true
        newWordsPerBatch: 2
        maxRepsPerDay: 3
        wrongInject: 2
        retryDelayMinutes: 5
        verifyAnswers: true
        articleMaxWords: 20
        includeHighFreq: true
        examLevel: cet4
        qqApiBase: https://api.sgroup.qq.com
        ladderMinutes: [10, 1440, 4320, 10080, 20160, 43200]
        highMultiplier: 0.7
        lowMultiplier: 1.6
        maxRecentErrors: 5
        startPrompt: 开始词汇复习
        continuePrompt: 继续复习
        dailyNewLimit: 20
        dailyReviewLimit: 50
        dailyTotalLimit: 0
        dailyMinutesLimit: 0
        reminderMaxPerDay: 1
