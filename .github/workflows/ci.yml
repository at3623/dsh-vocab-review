name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Host harness (quota / reminder / pause / resume)
        run: node test/harness.mjs
      - name: Session selector + strong-pause Stop harness
        run: node test/sessions-stop.mjs
      - name: Client half apply simulation
        run: node test/client-load-check.mjs
